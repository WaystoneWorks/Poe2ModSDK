# Hello both: a mod with a client half (DLL in the game) and a server half (library in the server),
# packed into one package. manifest_version 2 is required: older launchers and hooks refuse it.
manifest_version = 2
id = "hello-both"
name = "Hello both"
version = "0.1.0"
description = "A client DLL that logs hello and a server library that adds !hello."
authors = ["WaystoneWorks and contributors"]
license = "MIT"
side = "both"

[game]
versions = ["0.5.5e"]

[client]
dll = "client/hello_both_client.dll"
# The client mod ABI (poe_mod_sdk::client::HOOK_API_VERSION).
hook_api = 1

[server]
# The server mod ABI (poe_mod_sdk::server::api::SERVER_API_VERSION).
server_api = 1

[server.library]
linux = "server/libhello_both_server.so"
windows = "server/hello_both_server.dll"
