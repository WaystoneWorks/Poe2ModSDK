# Hello server: a server mod for the PoE2 private-server project (native Rust library).
# manifest_version 2 is required for server mods: older launchers and hooks refuse it on purpose.
manifest_version = 2
id = "hello-server"
name = "Hello server"
version = "0.1.0"
description = "Adds the !hello chat command."
authors = ["WaystoneWorks and contributors"]
license = "MIT"
side = "server"

[game]
versions = ["0.5.5f"]

[server]
# The server mod ABI this mod is built against (poe_mod_sdk::server::api::SERVER_API_VERSION).
server_api = 1

[server.library]
# One library per platform the mod supports; the server loads the one for its own OS.
linux = "server/libhello_server.so"
windows = "server/hello_server.dll"
